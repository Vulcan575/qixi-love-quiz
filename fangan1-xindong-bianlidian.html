<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤ 心动便利店 · 七夕限定</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
<style>
  :root{
    --cream:#FFF9EC;
    --warm:#FFCF5C;
    --warm-deep:#F5A623;
    --mint:#8FDDC2;
    --mint-deep:#4CB898;
    --ink:#4A3B32;
    --pink:#FF6B8A;
    --pink-deep:#E85D75;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'KaiTi','STKaiti','楷体','Microsoft YaHei',sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    background-image:radial-gradient(rgba(245,166,35,.10) 1.5px, transparent 1.5px);
    background-size:26px 26px;
    overflow-x:hidden;
  }
  .hidden{display:none !important}

  /* ============ 开场：推门 ============ */
  .intro{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    background:linear-gradient(180deg,#FFF3DC,var(--cream));
    transition:opacity .8s ease, visibility .8s;
  }
  .intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  .doorwrap{perspective:900px}
  .door{
    width:170px;height:240px;border:4px solid var(--ink);border-radius:16px;
    background:linear-gradient(180deg,#FFE9B8,#FFD66B);
    position:relative;overflow:hidden;
    transform-origin:left center;transition:transform 1.1s cubic-bezier(.5,.05,.3,1);
    box-shadow:6px 6px 0 rgba(74,59,50,.18);
  }
  .door::before{ /* 门上的窗 */
    content:'';position:absolute;top:20px;left:22px;right:22px;height:110px;
    background:linear-gradient(180deg,#BDE8D9,#D8F2E7);
    border:3px solid var(--ink);border-radius:12px;
    box-shadow:inset 0 0 14px rgba(76,184,152,.5);
  }
  .door::after{ /* 门把手 */
    content:'';position:absolute;top:135px;right:22px;width:14px;height:14px;
    background:var(--pink-deep);border:3px solid var(--ink);border-radius:50%;
  }
  .mini-awning{
    width:210px;height:22px;border:3px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;
    background:repeating-linear-gradient(90deg,#FF8A7A 0 26px,#FFF3E0 26px 52px);
    margin:0 auto 12px;
  }
  .intro h2{font-size:24px;letter-spacing:2px;color:var(--pink-deep);text-shadow:0 2px 0 rgba(255,255,255,.8)}
  .intro p{font-size:14px;color:#8a7563}
  .enter-btn{
    background:var(--mint-deep);color:#fff;border:3px solid var(--ink);
    border-radius:999px;padding:12px 36px;font-size:18px;font-family:inherit;font-weight:bold;
    cursor:pointer;box-shadow:4px 4px 0 rgba(74,59,50,.22);
    transition:transform .15s;
  }
  .enter-btn:hover{transform:translateY(-3px)}
  .enter-btn:active{transform:scale(.95)}
  .doorwrap.open .door{transform:rotateY(-82deg)}
  .doorwrap.open::after{ /* 门缝里的暖光 */
    content:'';position:absolute;left:110px;top:0;bottom:0;width:60px;
    background:linear-gradient(90deg,rgba(255,220,140,.9),rgba(255,236,180,0));
    filter:blur(6px);
  }

  /* 光线扫过 */
  .light{
    position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;
    background:linear-gradient(105deg,transparent 32%,rgba(255,240,200,.95) 50%,transparent 68%);
  }
  .light.sweep{animation:sweep 1.2s .3s ease forwards}
  @keyframes sweep{from{transform:translateX(-100%);opacity:0}15%{opacity:1}to{transform:translateX(100%);opacity:0}}

  /* ============ 店铺主体 ============ */
  .store{max-width:640px;margin:0 auto;padding:0 12px}
  .reveal{opacity:0;transform:translateY(22px)}
  body.entered .reveal{animation:riseIn .8s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0s)}
  @keyframes riseIn{to{opacity:1;transform:none}}

  /* 门头 */
  .storefront{position:relative;margin:0 -12px}
  .awning{height:30px;background:repeating-linear-gradient(90deg,#FF8A7A 0 30px,#FFF3E0 30px 60px);border-bottom:3px solid var(--ink)}
  .scallop{
    height:12px;background-color:#FF8A7A;
    background-image:radial-gradient(circle 9px at 12px -5px,#FF8A7A 0 9px,transparent 9.5px);
    background-size:24px 12px;background-position:left top;
    border-bottom:3px solid var(--ink);
  }
  .sign{
    position:relative;z-index:2;margin:-4px auto 0;max-width:340px;text-align:center;
    background:var(--cream);border:3px solid var(--ink);border-radius:16px;
    box-shadow:5px 5px 0 rgba(74,59,50,.18);padding:10px 20px 8px;
  }
  .sign h1{font-size:clamp(22px,7vw,32px);letter-spacing:3px}
  .sign .hl{color:var(--pink);text-shadow:0 0 14px rgba(255,107,138,.6)}
  .sign small{display:block;font-size:12px;color:#8a7563;margin-top:2px;letter-spacing:1px}

  /* 招财喵 */
  .catbox{
    position:absolute;z-index:3;right:10px;top:16px;
    background:var(--cream);border:3px solid var(--ink);border-radius:14px;
    box-shadow:4px 4px 0 rgba(74,59,50,.18);
    padding:8px 10px 6px;text-align:center;cursor:pointer;
    transform:rotate(3deg);transition:transform .15s;
  }
  .catbox:hover{transform:rotate(0) scale(1.05)}
  .catbox .cat{font-size:34px;display:block;animation:catWobble 2.4s ease-in-out infinite}
  @keyframes catWobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .catbox .label{font-size:11px;font-weight:bold;color:var(--warm-deep)}
  .catbox .hearts{display:flex;gap:2px;justify-content:center;margin-top:3px;min-height:12px}
  .catbox .hearts i{font-style:normal;font-size:9px;opacity:.25;transition:opacity .3s,transform .3s}
  .catbox .hearts i.on{opacity:1;transform:scale(1.25)}
  .catbox.jump .cat{animation:catJump .5s}
  @keyframes catJump{30%{transform:translateY(-12px) rotate(-10deg) scale(1.1)}}

  .welcome{
    display:flex;justify-content:center;margin:16px auto 6px;
  }
  .welcome .pill{
    background:var(--mint);border:3px solid var(--ink);border-radius:999px;
    padding:8px 20px;font-size:14px;font-weight:bold;letter-spacing:1px;
    box-shadow:3px 3px 0 rgba(74,59,50,.15);
  }
  .welcome b{color:var(--pink-deep);font-size:17px}

  /* ============ 货架区 ============ */
  .shelf{margin:26px 2px}
  .shelf-tag{
    display:inline-block;color:#fff;border:3px solid var(--ink);
    border-radius:999px;padding:7px 16px;font-size:15px;font-weight:bold;letter-spacing:1px;
    box-shadow:3px 3px 0 rgba(74,59,50,.16);
  }
  .shelf:nth-of-type(2) .shelf-tag{background:var(--warm-deep)}
  .shelf:nth-of-type(3) .shelf-tag{background:var(--mint-deep)}
  .shelf:nth-of-type(4) .shelf-tag{background:#E8853B}
  .shelf:nth-of-type(5) .shelf-tag{background:var(--pink-deep)}
  .shelf:nth-of-type(6) .shelf-tag{background:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px;margin-top:16px}
  .item{
    background:#fff;border:3px solid var(--ink);border-radius:16px;
    box-shadow:4px 4px 0 rgba(74,59,50,.16);
    padding:14px 12px;text-align:center;cursor:pointer;
    transition:transform .18s,box-shadow .18s;
    animation:bob 3.4s ease-in-out infinite;
    animation-delay:var(--d,0s);
  }
  .item:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:6px 9px 0 rgba(74,59,50,.2)}
  .item:active{transform:scale(.96)}
  .item:nth-child(1){--d:0s}.item:nth-child(2){--d:-.7s}.item:nth-child(3){--d:-1.4s}
  .item:nth-child(4){--d:-.4s}.item:nth-child(5){--d:-1.1s}.item:nth-child(6){--d:-1.8s}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  .item .emoji{font-size:38px;line-height:1.2;display:block;margin-bottom:6px}
  .item .t{font-weight:bold;font-size:15px}
  .item .s{font-size:12px;color:#8a7563;margin-top:5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item.picked{animation:pick .5s ease}
  @keyframes pick{
    20%{transform:translateY(-12px) rotate(3deg) scale(1.06)}
    60%{transform:translateY(-4px) rotate(-2deg)}
  }
  .item.bento{background:linear-gradient(180deg,#fff 0 40%,#FFE9B8 40% 100%)}
  .item.candy{background:#FFF4E0}

  /* 照片墙 */
  .photos{margin-top:30px}
  .stringline{
    display:flex;justify-content:space-around;align-items:center;
    border-top:2px dashed rgba(74,59,50,.35);height:0;margin-bottom:24px;
  }
  .stringline i{
    width:11px;height:11px;border-radius:50%;margin-top:-5px;
    background:radial-gradient(circle,#FFF3C4,#F5A623);
    box-shadow:0 0 8px 2px rgba(245,166,53,.55);
    animation:blink 1.7s infinite;animation-delay:var(--i,0s);
  }
  @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 8px 3px rgba(245,166,53,.65)}50%{opacity:.35;box-shadow:0 0 3px 0 rgba(245,166,53,.25)}}
  .polaroids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}
  .polaroid{
    position:relative;background:#fff;padding:10px 10px 14px;
    border:2px solid var(--ink);box-shadow:4px 6px 0 rgba(74,59,50,.16);
    transform:rotate(var(--r,0deg));cursor:pointer;
    transition:transform .25s,box-shadow .25s;
  }
  .polaroid:hover{transform:rotate(0) translateY(-7px);box-shadow:6px 10px 0 rgba(74,59,50,.22)}
  .polaroid::before{
    content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(4deg);
    width:56px;height:20px;background:rgba(143,221,194,.8);
    border:1px solid rgba(74,59,50,.3);
  }
  .polaroid .photo{
    aspect-ratio:1/1.05;border-radius:6px;overflow:hidden;
    background:linear-gradient(160deg,#FFE9B8,#FFCF5C);
    display:flex;align-items:center;justify-content:center;font-size:54px;
  }
  .polaroid .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .polaroid .cap{font-size:12px;text-align:center;margin-top:9px;color:#6b5b4b;letter-spacing:1px}

  /* 收银台 */
  .counter{
    margin-top:18px;background:linear-gradient(180deg,#F7E7C9,#E7D2A6);
    border:3px solid var(--ink);border-radius:16px;
    box-shadow:4px 6px 0 rgba(74,59,50,.18);
    padding:16px;text-align:center;
  }
  .counter .top{font-size:30px;letter-spacing:6px}
  .counter p{font-size:14px;margin-top:6px;color:#6b5b4b}
  .cashier{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:16px}
  .checkout-btn{
    background:var(--mint-deep);color:#fff;border:3px solid var(--ink);
    border-radius:999px;padding:13px 38px;font-size:18px;font-weight:bold;font-family:inherit;
    cursor:pointer;box-shadow:4px 4px 0 rgba(74,59,50,.22);
    transition:transform .15s;
  }
  .checkout-btn:hover{transform:translateY(-3px)}
  .checkout-btn:active{transform:scale(.95)}

  footer{margin:36px 0 96px;text-align:center;font-size:13px;color:#8a7563;line-height:2}
  footer .big{font-size:15px;color:var(--pink-deep)}

  /* ============ 购物车 ============ */
  .cart-fab{
    position:fixed;right:14px;bottom:18px;z-index:60;
    width:58px;height:58px;border-radius:50%;
    background:var(--warm);border:3px solid var(--ink);
    box-shadow:0 5px 14px rgba(0,0,0,.22);
    display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;
  }
  .cart-fab:hover{transform:scale(1.06)}
  .cart-fab .badge{
    position:absolute;top:-7px;right:-7px;min-width:23px;height:23px;padding:0 5px;
    background:var(--pink-deep);color:#fff;border:2px solid #fff;border-radius:999px;
    font-size:12px;font-family:'Microsoft YaHei',sans-serif;font-weight:bold;
    display:flex;align-items:center;justify-content:center;
  }
  .cart-fab.bounce{animation:fabBounce .45s}
  @keyframes fabBounce{30%{transform:scale(1.22) rotate(-8deg)}}

  .cart-panel{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
    width:min(430px,93vw);max-height:58vh;z-index:70;
    background:var(--cream);border:3px solid var(--ink);border-radius:18px;
    box-shadow:0 12px 34px rgba(0,0,0,.3);
    display:flex;flex-direction:column;overflow:hidden;
    animation:popIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  .cart-panel header{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;background:var(--warm);border-bottom:3px solid var(--ink);
    font-weight:bold;letter-spacing:1px;
  }
  .cart-panel header button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink)}
  .cart-rows{overflow-y:auto;padding:6px 16px;flex:1}
  .cart-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(74,59,50,.28)}
  .cart-row:last-child{border-bottom:none}
  .cart-row .emoji{font-size:24px}
  .cart-row .t{flex:1;font-size:14px;font-weight:bold}
  .cart-row button{background:none;border:none;color:#c96;font-size:14px;cursor:pointer;padding:4px}
  .cart-empty{text-align:center;color:#8a7563;padding:22px 10px;font-size:14px}
  .cart-foot{display:flex;gap:10px;padding:12px 16px;border-top:3px solid var(--ink)}
  .cart-foot .btn{flex:1}

  /* ============ 弹层 ============ */
  .overlay{
    position:fixed;inset:0;z-index:80;
    background:rgba(58,45,38,.55);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .modal{
    position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:20px;
    max-width:430px;width:100%;max-height:84vh;overflow-y:auto;
    padding:24px 20px 20px;text-align:center;
    box-shadow:7px 9px 0 rgba(0,0,0,.18);
    animation:popIn .32s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn{from{transform:scale(.85);opacity:0}}
  .modal .close-btn{
    position:absolute;top:8px;right:12px;font-size:22px;cursor:pointer;
    color:#8a7563;background:none;border:none;
  }
  .modal .big{font-size:66px;display:block;margin:8px 0 12px}
  .modal h3{margin:0 0 12px;color:var(--pink-deep);letter-spacing:2px;font-size:22px}
  .modal p{margin:0 0 20px;line-height:1.9;color:var(--ink);font-size:15px;text-align:left;padding:0 4px}
  .modal p.center{text-align:center}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{
    border:3px solid var(--ink);border-radius:999px;padding:10px 22px;
    font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer;
    box-shadow:3px 3px 0 rgba(74,59,50,.2);transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.94)}
  .btn.primary{background:var(--mint-deep);color:#fff}
  .btn.warm{background:var(--warm-deep);color:#fff}
  .btn.ghost{background:var(--cream);color:var(--ink)}

  /* ============ 小票 ============ */
  .receipt{
    position:relative;background:#fff;border:1px solid #ddd;border-radius:4px;
    padding:20px 16px 16px;text-align:left;
    font-family:'Courier New','KaiTi','STKaiti',monospace;font-size:13px;color:#3a3a3a;
    max-height:58vh;overflow-y:auto;margin-top:8px;
  }
  .receipt::before,.receipt::after{
    content:'';position:absolute;left:0;right:0;height:12px;pointer-events:none;
  }
  .receipt::before{
    top:-12px;background:
      linear-gradient(45deg,transparent 6px,#fff 6px) 0 0/12px 12px repeat-x,
      linear-gradient(-45deg,transparent 6px,#fff 6px) 6px 0/12px 12px repeat-x;
  }
  .receipt::after{
    bottom:-12px;background:
      linear-gradient(45deg,#fff 6px,transparent 6px) 0 0/12px 12px repeat-x,
      linear-gradient(-45deg,#fff 6px,transparent 6px) 6px 0/12px 12px repeat-x;
  }
  .receipt h4{text-align:center;margin:0 0 4px;font-size:16px;letter-spacing:2px}
  .receipt .muted{font-size:11px;color:#999;text-align:center;margin-bottom:6px}
  .receipt .rdot{border-bottom:1px dashed #bbb;margin:10px 0}
  .receipt .rline{line-height:1.6;margin:3px 0;min-height:20px}
  .receipt .rtotal{text-align:center;font-size:15px;font-weight:bold;margin-top:10px;letter-spacing:1px}
  .receipt .rfoot{text-align:center;font-size:11px;color:#999;margin-top:10px}
  .receipt .rline::after{content:'▌';color:#999;animation:caret 1s step-end infinite}
  @keyframes caret{50%{opacity:0}}

  /* ============ 彩蛋 & 装饰 ============ */
  .toast{
    position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:90;
    background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;
    font-size:14px;letter-spacing:1px;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    animation:popIn .3s ease;
  }
  .heart-fall{
    position:fixed;z-index:95;pointer-events:none;font-size:20px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    from{transform:translateY(-40px) rotate(0);opacity:1}
    to{transform:translateY(105vh) rotate(320deg);opacity:.3}
  }
  .cat-say{
    position:fixed;z-index:90;background:#fff;border:2px solid var(--ink);border-radius:14px;
    padding:8px 14px;font-size:13px;box-shadow:3px 4px 0 rgba(74,59,50,.2);
    animation:popIn .3s ease;
  }
  .cat-say::before{
    content:'';position:absolute;bottom:-12px;left:38px;
    border:6px solid transparent;border-top-color:var(--ink);border-bottom:none;
  }

  @media (max-width:400px){
    .grid,.polaroids{grid-template-columns:repeat(2,1fr)}
    .catbox{right:6px;top:12px;padding:6px 8px 4px}
    .catbox .cat{font-size:28px}
  }
</style>
</head>
<body>

<!-- 开场：推门 -->
<div class="intro" id="intro">
  <div class="mini-awning"></div>
  <div class="doorwrap" id="doorwrap">
    <div class="door"></div>
  </div>
  <div>
    <h2>心动便利店</h2>
    <p>叮咚 —— 欢迎光临 · 七夕限定</p>
    <p style="margin-top:4px;color:#c98a2e">我们在一起的第 <b id="introDay">?</b> 天</p>
  </div>
  <button class="enter-btn" id="enterBtn">推开门 🚪</button>
</div>
<div class="light" id="light"></div>

<div class="store" id="store">

  <!-- 门头 -->
  <header class="storefront">
    <div class="awning"></div>
    <div class="scallop"></div>
    <div class="sign reveal" style="--d:.05s">
      <h1><span class="hl">心动</span>便利店</h1>
      <small>24H 营业中 · 七夕限定 · 欢迎光临</small>
    </div>
    <div class="catbox reveal" id="catbox" style="--d:.15s" title="摸摸招财喵">
      <span class="cat">🐱</span>
      <div class="label">招财喵</div>
      <div class="hearts" id="catHearts"></div>
    </div>
    <div class="welcome reveal" style="--d:.25s">
      <div class="pill">叮咚 ~ 我们在一起的第 <b id="dayN"></b> 天 ❤</div>
    </div>
  </header>

  <!-- 饮料柜 -->
  <section class="shelf reveal" style="--d:.35s">
    <span class="shelf-tag">🥤 饮料柜 · 甜蜜时刻</span>
    <div class="grid" id="drinksGrid"></div>
  </section>

  <!-- 便当区 -->
  <section class="shelf reveal" style="--d:.45s">
    <span class="shelf-tag">🍱 便当区 · 共同经历</span>
    <div class="grid" id="bentosGrid"></div>
  </section>

  <!-- 糖果架 -->
  <section class="shelf reveal" style="--d:.55s">
    <span class="shelf-tag">🍬 糖果架 · 日常小确幸</span>
    <div class="grid" id="candiesGrid"></div>
  </section>

  <!-- 照片墙 -->
  <section class="shelf reveal" style="--d:.65s">
    <span class="shelf-tag">📸 照片墙 · 灯串回忆</span>
    <div class="photos">
      <div class="stringline" id="stringline"></div>
      <div class="polaroids" id="polaroids"></div>
    </div>
  </section>

  <!-- 收银台 -->
  <section class="shelf reveal" style="--d:.75s">
    <span class="shelf-tag">🧾 收银台 · 结账时间</span>
    <div class="cashier">
      <div class="counter">
        <div class="top">🧾 🧮 💳</div>
        <p>把喜欢的东西都放进购物车，<br>然后来这里结账 —— 小票上写满了告白。</p>
      </div>
      <button class="checkout-btn" id="checkoutBtn">现在结账 💳</button>
    </div>
  </section>

  <footer class="reveal" style="--d:.85s">
    <div class="big">心动便利店 · 24小时永远营业 ❤</div>
    本店商品概不退换 · 只此一家 · 只为你一人开放<br>
    made with ❤ by <span id="footName">你的名字</span>
  </footer>
</div>

<!-- 购物车浮钮 -->
<div class="cart-fab hidden" id="cartFab" title="购物车">🛒<span class="badge" id="cartCount">0</span></div>
<div class="cart-panel hidden" id="cartPanel">
  <header>🛒 我的购物车 <button id="closeCart">✕</button></header>
  <div class="cart-rows" id="cartRows"></div>
  <div class="cart-foot">
    <button class="btn ghost" id="continueBtn">继续逛逛</button>
    <button class="btn primary" id="toCheckoutBtn">去收银台 💳</button>
  </div>
</div>

<!-- 通用弹层 -->
<div class="overlay hidden" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* =====================================================
   ✏️ 定制入口：改这里就能变成你们的专属小店
   ===================================================== */
const CONFIG = {
  herName: "宝贝",            // 她的昵称（暂时用不到可以不改）
  myName: "你的名字",         // 你的名字（显示在页脚）
  openDate: "2023-08-22",     // ★ 你们在一起的纪念日，格式 YYYY-MM-DD（会算第几天）

  /* 饮料柜：每一瓶饮料 = 一个甜蜜时刻 */
  drinks: [
    { emoji:"🧋", title:"第一杯奶茶",  text:"那天我排了很久的队，买到你最爱的芋圆波波。你喝第一口时眼睛亮了一下，我就知道——这队排得值。" },
    { emoji:"🥤", title:"夏夜的汽水",  text:"两块钱一瓶的快乐，你说比什么都好喝。以后每个夏天，我都想和你干杯。" },
    { emoji:"☕", title:"深夜的咖啡",  text:"期末周那晚，我们视频连线一起喝咖啡，你困得不行也不肯挂。那时的月色，现在想起来还是会笑。" },
    { emoji:"🍹", title:"生日特调",    text:"去年你生日，我偷偷调的特饮。配方其实很简单：三分喜欢你，七分更爱你。" },
    { emoji:"🧃", title:"晒后的果汁",  text:"第一次去海边，你被晒得红扑扑。冰果汁配海风，你笑的样子比日落好看。" },
  ],

  /* 便当区：每一盒便当 = 一段共同经历 */
  bentos: [
    { emoji:"🍱", title:"第一次一起做饭", text:"糊掉的番茄炒蛋，你居然说好吃。从那以后我的拿手菜就叫「你爱吃的」。" },
    { emoji:"🍙", title:"凌晨的便利店饭团", text:"加班到凌晨，我们在便利店一人一个饭团，靠在一起看星星。平凡的夜晚，因为你在变得特别。" },
    { emoji:"🥟", title:"冬至的饺子", text:"你包的饺子像小船，我包的像……不明物体。没关系，反正最后都被吃光了。" },
    { emoji:"🍜", title:"感冒特供面", text:"你感冒那周，我给你煮了碗面。你说那是全世界最好吃的病号餐——虽然我知道，是滤镜加的糖。" },
  ],

  /* 糖果架：每一颗糖 = 一句土味情话 */
  candies: [
    "你问我最喜欢什么糖？—— 你。",
    "心跳甜度已超标，请宝贝负责。",
    "今天也在偷偷给你加糖。",
    "我对你的喜欢，甜度永续，不限量。",
    "你是我的多巴胺，直接上瘾。",
    "糖会化，我对你不会。",
  ],

  /* 照片墙：放你们的照片！把图片文件放到同目录 images/ 文件夹，
     然后在这里填文件名，例如 img:"images/照片1.jpg"。留空则显示 emoji 占位 */
  photos: [
    { emoji:"🌻", img:"", caption:"第一次见面那天" },
    { emoji:"🎡", img:"", caption:"游乐园的傍晚" },
    { emoji:"🌙", img:"", caption:"一起看过的月亮" },
    { emoji:"🎂", img:"", caption:"给你过的第一个生日" },
  ],

  /* 小票上的告白：会一行一行打印出来 */
  receiptLines: [
    "叮—— 结账成功",
    "商品：快乐 × 999",
    "商品：拥抱 × 999",
    "商品：亲亲 × 999",
    "商品：日常的小确幸 × 不限量",
    "━━━━━━━━━━━━━━━",
    "宝贝，遇见你之前，日子是 24 小时；",
    "遇见你之后，日子被分成了「想你」和「见你」。",
    "七夕快乐。",
    "未来的每一天，我都想和你一起结账。",
    "━━━━━━━━━━━━━━━",
    "合计：这一生，请多多关照 ❤",
  ],

  /* 招财喵彩蛋：连续摸 10 下触发「老板的秘密告白」 */
  catSecret: {
    title: "老板的秘密告白 🕰️",
    text: "老板说：其实这家店的真正开业时间，是遇见你的那一天。从此所有货架上都只有一样商品——我全部的心意。你随便拿，不限量，永远补货。\n\n❤ 七夕快乐，我的宝贝。",
  },
  /* 想放语音/视频彩蛋？把音频文件放到同目录（如 boss.mp3），
     填进下面这一行，摸猫 10 下时就会播放；留空则播放内置的小旋律 */
  bossAudio: "",
};

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const dayN = Math.max(1, Math.floor((new Date().setHours(0,0,0,0) - new Date(CONFIG.openDate).setHours(0,0,0,0)) / 86400000) + 1);

/* ---------- 音效（Web Audio 合成，无需任何文件） ---------- */
let AC = null;
function ac(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type='sine', vol=.15, delay=0){
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  const t = c.currentTime + delay;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + .06);
}
const dingDong = () => { tone(659,.3,'sine',.22); tone(880,.5,'sine',.22,.16); };
const pop      = () => { tone(620,.09,'triangle',.2); tone(920,.07,'triangle',.14,.05); };
const kaChing  = () => { tone(1150,.07,'square',.06); tone(1600,.14,'square',.06,.09); };
const beep     = () => { tone(2350,.022,'square',.028); };
const coin     = () => { tone(880,.08,'square',.07); tone(1320,.16,'square',.07,.09); };

/* ================= 弹层 ================= */
const overlay = $('#overlay'), modalBox = $('#modalBox');
function openModal(html){
  modalBox.innerHTML = html;
  overlay.classList.remove('hidden');
}
function closeModal(){ overlay.classList.add('hidden'); }
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeModal(); hideCart(); } });

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 1700);
}

/* ================= 购物车 ================= */
let cart = [];
function renderCartRows(){
  const rows = $('#cartRows');
  if(!cart.length){
    rows.innerHTML = '<div class="cart-empty">购物车还是空的……<br>要不要装点心动？🛒</div>';
    return;
  }
  rows.innerHTML = cart.map((it,i) =>
    `<div class="cart-row"><span class="emoji">${it.emoji}</span><span class="t">${it.title}</span><button data-del="${i}">✕</button></div>`
  ).join('');
}
function updateCartBadge(){
  const fab = $('#cartFab'), badge = $('#cartCount');
  badge.textContent = cart.length;
  fab.classList.toggle('hidden', cart.length === 0);
  fab.classList.remove('bounce'); void fab.offsetWidth; fab.classList.add('bounce');
}
function addToCart(item){
  cart.push(item); renderCartRows(); updateCartBadge();
  pop(); toast('叮！已加入购物车 🛒');
}
function showCart(){ renderCartRows(); $('#cartPanel').classList.remove('hidden'); }
function hideCart(){ $('#cartPanel').classList.add('hidden'); }
$('#cartFab').addEventListener('click', showCart);
$('#closeCart').addEventListener('click', hideCart);
$('#continueBtn').addEventListener('click', hideCart);
$('#toCheckoutBtn').addEventListener('click', () => { hideCart(); printReceipt(); });
$('#cartRows').addEventListener('click', e => {
  const b = e.target.closest('[data-del]');
  if(!b) return;
  cart.splice(+b.dataset.del, 1);
  renderCartRows(); updateCartBadge();
  if(!cart.length) toast('空空如也~');
});

/* ================= 商品渲染 ================= */
function renderShelf(container, items, extraCls){
  container.innerHTML = items.map((it,i) =>
    `<div class="item ${extraCls}" data-i="${i}">
       <span class="emoji">${it.emoji}</span>
       <div class="t">${it.title}</div>
       <div class="s">${it.text}</div>
     </div>`
  ).join('');
}
function openItemModal(items, i){
  const it = items[i];
  openModal(`
    <button class="close-btn">✕</button>
    <span class="big">${it.emoji}</span>
    <h3>${it.title}</h3>
    <p>${it.text}</p>
    <div class="btns">
      <button class="btn primary" id="addCartBtn">加入购物车 🛒</button>
      <button class="btn ghost" id="closeModalBtn">好耶 ✨</button>
    </div>`);
  $('#addCartBtn').onclick = () => { addToCart(it); closeModal(); };
  $('#closeModalBtn').onclick = closeModal;
  modalBox.querySelector('.close-btn').onclick = closeModal;
}
const gridClick = items => e => {
  const card = e.target.closest('.item');
  if(!card) return;
  const i = +card.dataset.i;
  pop();
  card.classList.remove('picked'); void card.offsetWidth; card.classList.add('picked');
  setTimeout(() => openItemModal(items, i), 280);
};
renderShelf($('#drinksGrid'),  CONFIG.drinks,  '');
renderShelf($('#bentosGrid'), CONFIG.bentos, 'bento');
renderShelf($('#candiesGrid'), CONFIG.candies.map(c => ({emoji: Math.random()<.5?'🍬':'🍭', title:'好甜一颗糖', text:c})), 'candy');
$('#drinksGrid').addEventListener('click', gridClick(CONFIG.drinks));
$('#bentosGrid').addEventListener('click', gridClick(CONFIG.bentos));
$('#candiesGrid').addEventListener('click', gridClick(CONFIG.candies));

/* ================= 照片墙 ================= */
function renderPhotos(){
  $('#stringline').innerHTML = Array.from({length:7}, (_,i) => `<i style="--i:-${i*.3}s"></i>`).join('');
  $('#polaroids').innerHTML = CONFIG.photos.map((p,i) => {
    const img = p.img ? `<img src="${p.img}" alt="${p.caption}">` : `<span style="font-size:54px">${p.emoji}</span>`;
    const r = [-2.5, 2, -1.5, 3][i % 4];
    return `<div class="polaroid" data-p="${i}" style="--r:${r}deg">
      <div class="photo">${img}</div>
      <div class="cap">${p.caption}</div>
    </div>`;
  }).join('');
}
$('#polaroids').addEventListener('click', e => {
  const p = e.target.closest('.polaroid');
  if(!p) return;
  const item = CONFIG.photos[+p.dataset.p];
  const img = item.img ? `<img src="${item.img}" style="width:100%;max-height:58vh;object-fit:contain">` : `<span class="big">${item.emoji}</span>`;
  coin();
  openModal(`
    <button class="close-btn">✕</button>
    ${img}
    <h3 style="margin-top:14px">${item.caption}</h3>
    <p class="center">💡 想把照片换成你们的合照？把图片放进 images/ 文件夹，<br>在文件顶部的 CONFIG.photos 里填 img:"images/xxx.jpg" 就行~</p>
    <div class="btns"><button class="btn ghost" id="closeModalBtn">收好 💌</button></div>`);
  $('#closeModalBtn').onclick = closeModal;
  modalBox.querySelector('.close-btn').onclick = closeModal;
});

/* ================= 收银台 · 小票 ================= */
function printReceipt(){
  kaChing();
  const items = cart.length
    ? cart.map(it => `· ${it.emoji} ${it.title} × 1`)
    : ['· ❤ 一份心动（贴心送）', '· 🧋 一杯今日份甜', '· 🍬 不限量喜欢你'];
  let html = `
    <button class="close-btn">✕</button>
    <h3>🧾 小票打印中…</h3>
    <div class="receipt" id="receiptPaper">
      <h4>心动便利店</h4>
      <div class="muted">心 · 动 · 便 · 利 · 店 · 永 · 远 · 营 · 业</div>
      <div class="rdot"></div>
      ${items.map(i => `<div class="rline">${i}</div>`).join('')}
      <div class="rdot"></div>
      <div id="receiptLines"></div>
      <div class="rdot" id="receiptTail" style="display:none"></div>
      <div class="rtotal" id="receiptTotal" style="display:none">合计：这一生 ❤</div>
      <div class="rfoot" id="receiptFoot" style="display:none">谢谢惠顾 · 下次还要来哦 · 本票终身有效</div>
    </div>
    <div class="btns" style="margin-top:16px">
      <button class="btn ghost hidden" id="closeModalBtn">收好这张小票 💌</button>
    </div>`;
  openModal(html);
  const paper = $('#receiptPaper');
  setTimeout(() => paper.scrollTop = paper.scrollHeight, 30);

  const lines = [...CONFIG.receiptLines, ...(cart.length ? [] : ['（你什么都没加购？没关系——', ' 反正我的心早就为你打好折了 ❤）'])];
  const box = $('#receiptLines');
  let idx = 0;
  function nextLine(){
    if(idx >= lines.length){
      $('#receiptTail').style.display = '';
      $('#receiptTotal').style.display = '';
      $('#receiptFoot').style.display = '';
      $('#closeModalBtn').classList.remove('hidden');
      coin(); coin();
      paper.scrollTop = paper.scrollHeight;
      return;
    }
    const p = document.createElement('div');
    p.className = 'rline';
    box.appendChild(p);
    const text = lines[idx];
    let ci = 0;
    const iv = setInterval(() => {
      p.textContent = text.slice(0, ++ci);
      if(ci % 3 === 0) beep();
      paper.scrollTop = paper.scrollHeight;
      if(ci >= text.length){
        clearInterval(iv);
        idx++;
        setTimeout(nextLine, 220);
      }
    }, 42);
  }
  setTimeout(nextLine, 550);
  modalBox.querySelector('.close-btn').onclick = closeModal;
  $('#closeModalBtn').onclick = closeModal;
}
$('#checkoutBtn').addEventListener('click', printReceipt);

/* ================= 开场：推门 ================= */
function startStore(){
  ac(); // 首次点击 = 用户手势，允许播放声音
  dingDong();
  $('#doorwrap').classList.add('open');
  const light = $('#light'); light.classList.add('sweep');
  setTimeout(() => {
    $('#intro').classList.add('hide');
    document.body.classList.add('entered');
    setTimeout(() => $('#intro').remove(), 900);
  }, 1300);
}
$('#enterBtn').addEventListener('click', startStore);
document.addEventListener('click', () => { try{ ac(); }catch(e){} }, { once:true });

/* ================= 招财喵彩蛋 ================= */
let catClicks = 0;
const catSays = [
  "欢迎光临~喵~",
  "老板说今天心情很好~",
  "再摸摸我呀~",
  "好运正在打包中！",
  "就差一点点啦…",
];
const catBox = $('#catbox');
function fillCatHearts(){
  $('#catHearts').innerHTML = Array.from({length:10}, (_,i) =>
    `<i class="${i < catClicks ? 'on' : ''}">❤</i>`).join('');
}
function catSay(text){
  const old = document.querySelector('.cat-say'); if(old) old.remove();
  const b = document.createElement('div');
  b.className = 'cat-say';
  b.textContent = text;
  b.style.left = Math.min(catBox.getBoundingClientRect().left - 30, window.innerWidth - 190) + 'px';
  b.style.top = (catBox.getBoundingClientRect().top + 90) + 'px';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 2200);
}
function burstHearts(n = 26){
  const syms = ['❤','💗','💖','✨','🎀','🌸'];
  for(let i = 0; i < n; i++){
    const h = document.createElement('span');
    h.className = 'heart-fall';
    h.textContent = syms[Math.floor(Math.random() * syms.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (12 + Math.random() * 16) + 'px';
    h.style.animationDuration = (1.3 + Math.random() * 1.3) + 's';
    h.style.animationDelay = (Math.random() * .5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3500);
  }
}
function bossSecret(){
  pop();
  openModal(`
    <button class="close-btn">✕</button>
    <span class="big">🐱💖</span>
    <h3>${CONFIG.catSecret.title}</h3>
    <p>${CONFIG.catSecret.text.replace(/\n/g,'<br>')}</p>
    <p class="center" style="font-size:12px;color:#8a7563">🔊 想放专属语音/视频彩蛋？把音频文件放到同目录，在文件顶部的 CONFIG.bossAudio 里填文件名即可</p>
    <div class="btns"><button class="btn warm" id="closeModalBtn">收下这份告白 💌</button></div>`);
  $('#closeModalBtn').onclick = closeModal;
  modalBox.querySelector('.close-btn').onclick = closeModal;
  // 内置小旋律（如果不使用自定义音频）
  if(!CONFIG.bossAudio){
    const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880, 698.46];
    melody.forEach((f, i) => tone(f, .42, 'sine', .12, i * .38));
  } else {
    try { new Audio(CONFIG.bossAudio).play(); } catch(e){}
  }
  burstHearts();
}
catBox.addEventListener('click', () => {
  catClicks++;
  pop();
  catBox.classList.remove('jump'); void catBox.offsetWidth; catBox.classList.add('jump');
  fillCatHearts();
  if(catClicks >= 10){
    catClicks = 0; fillCatHearts();
    bossSecret();
  } else if(catClicks % 3 === 0 || catClicks === 9){
    catSay(catSays[Math.min(catClicks / 3 | 0, catSays.length - 1)]);
  }
});

/* ================= 初始化 ================= */
$('#dayN').textContent = dayN;
$('#introDay').textContent = dayN;
$('#footName').textContent = CONFIG.myName;
fillCatHearts();
renderPhotos();
</script>
</body>
</html>
