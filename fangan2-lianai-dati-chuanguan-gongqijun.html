<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌷 LOVE QUIZ · 恋爱答题闯关</title>
<meta name="theme-color" content="#CFE8F5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
<style>
  :root{
    --ink:#6B5B4E;          /* 手绘深棕 */
    --ink-soft:#9A8A78;     /* 柔和描边 */
    --cream:#FFFDF6;        /* 奶油 */
    --paper:#FFF9EC;        /* 牛皮纸 */
    --sky:#CFE8F5;          /* 天空蓝 */
    --sky-2:#EAF7FC;        /* 地平线 */
    --grass:#8FBF6E;        /* 草绿 */
    --grass-2:#6FA74F;      /* 深草绿 */
    --pink:#E8899C;         /* 樱花粉 */
    --pink-soft:#F7C8D4;
    --blue:#7FA6C9;         /* 柔和蓝 */
    --yellow:#FBD77E;       /* 暖黄 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Yuanti SC',sans-serif;
    color:var(--ink);
    overflow-x:hidden;user-select:none;max-width:100%;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 62%,#E2F2DF 100%);
  }

  /* ============ 固定背景：天空 + 云朵 + 飞鸟 + 山丘 + 草地 ============ */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .cloud{position:absolute;opacity:.95}
  .c1{top:7%;animation:drift 34s ease-in-out infinite alternate}
  .c2{top:20%;animation:drift 47s ease-in-out infinite alternate;animation-delay:-13s}
  .c3{top:38%;animation:drift 55s ease-in-out infinite alternate;animation-delay:-27s}
  @keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(26px)}}
  .bird{position:absolute;top:15%;left:-80px;animation:fly 24s linear infinite;opacity:.8}
  .bird.b2{top:30%;animation-duration:32s;animation-delay:-14s;transform:scale(.7)}
  @keyframes fly{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 200px))}}
  .hill-far{position:absolute;bottom:16%;left:-6%;width:114%;opacity:.75}
  .hill-mid{position:absolute;bottom:5%;left:-12%;width:126%;opacity:.9}
  .meadow{position:absolute;bottom:0;left:0;right:0;height:30vh}
  .meadow svg{display:block;width:100%;height:100%}
  .grow{position:absolute;bottom:0;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  .hidden{display:none !important}

  /* ============ 通用屏幕 ============ */
  .screen{position:relative;z-index:2;min-height:100vh;width:100%;max-width:560px;margin:0 auto;padding:26px 20px 30px;min-width:0}
  .screen.active{display:flex;flex-direction:column;align-items:center}
  .screen.active.anim{animation:screenIn .6s cubic-bezier(.2,.9,.3,1)}
  @keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  #soundBtn{
    position:fixed;top:14px;right:14px;z-index:60;
    width:44px;height:44px;border:2.5px solid var(--ink-soft);border-radius:50%;
    background:rgba(255,253,246,.9);font-size:18px;cursor:pointer;line-height:1;
    box-shadow:0 6px 14px rgba(107,91,78,.15);
  }
  #soundBtn:active{transform:scale(.94)}

  /* ============ 开场 ============ */
  #intro{justify-content:center;text-align:center;overflow:hidden}
  .badge{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:4px;color:var(--ink);
    background:rgba(255,253,246,.85);border:2px solid rgba(154,138,120,.6);border-radius:999px;
    padding:6px 20px;transform:rotate(-1.5deg);box-shadow:0 4px 10px rgba(107,91,78,.08);
  }
  .intro h1{
    margin-top:22px;font-size:clamp(36px,10vw,52px);letter-spacing:8px;font-weight:800;
    color:#fff;-webkit-text-stroke:2px var(--ink);
    text-shadow:0 5px 0 rgba(107,91,78,.14);
  }
  .intro .sub{
    margin-top:16px;font-size:17px;font-weight:800;letter-spacing:3px;color:var(--ink);
    background:var(--cream);border:2.5px solid var(--ink-soft);border-radius:999px;
    padding:8px 24px;box-shadow:0 5px 12px rgba(107,91,78,.1);
  }
  .intro .sub b{color:var(--pink);font-weight:900}
  .intro .sub .he{color:var(--blue);font-weight:900}
  .intro .tip{
    margin-top:16px;font-size:13px;font-weight:700;color:#8A7A68;
    background:rgba(255,253,246,.8);border:2px dashed var(--pink-soft);
    border-radius:999px;padding:8px 20px;
  }
  .enter-btn{
    margin-top:26px;border:2.5px solid var(--ink-soft);border-radius:999px;padding:15px 52px;
    font-size:18px;font-family:inherit;font-weight:900;letter-spacing:4px;color:var(--ink);cursor:pointer;
    background:linear-gradient(180deg,#FFF3C9 0%,var(--yellow) 100%);
    box-shadow:0 8px 20px rgba(107,91,78,.18);
    position:relative;overflow:hidden;
    transition:transform .15s, box-shadow .15s;
  }
  .enter-btn::after{ /* 柔和高光 */
    content:'';position:absolute;top:-40%;left:-60%;width:45%;height:180%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .enter-btn:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(107,91,78,.22)}
  .enter-btn:active{transform:translateY(2px) scale(.98);box-shadow:0 4px 10px rgba(107,91,78,.16)}

  /* 小屋场景 */
  .scene{position:relative;width:min(310px,80vw);margin-top:30px;pointer-events:none}
  .scene svg{width:100%;height:auto;display:block}
  .smoke{animation:rise 4.4s ease-out infinite;transform-box:fill-box}
  .smoke.s2{animation-delay:1.5s}
  .smoke.s3{animation-delay:3s}
  @keyframes rise{
    0%{transform:translate(199px,58px) scale(.4);opacity:0}
    15%{opacity:.75}
    100%{transform:translate(190px,-16px) scale(1);opacity:0}
  }
  .made-by{
    margin-top:20px;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--ink);
    background:rgba(255,253,246,.8);border:2px solid rgba(154,138,120,.55);border-radius:999px;
    padding:4px 16px;
  }
  .float{position:absolute;pointer-events:none;animation:floatUp linear infinite}
  @keyframes floatUp{
    0%{transform:translateY(104vh) rotate(0deg);opacity:0}
    10%{opacity:.75}
    80%{opacity:.7}
    100%{transform:translateY(-14vh) rotate(18deg);opacity:0}
  }

  /* ============ 答题 ============ */
  #quiz{justify-content:flex-start}
  .quiz-head{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .progress{display:flex;gap:6px}
  .progress i{
    font-style:normal;font-size:21px;opacity:.35;filter:grayscale(.7);
    transition:filter .4s, opacity .4s, transform .4s;
  }
  .progress i.on{
    opacity:1;filter:none;transform:scale(1.2);
    animation:bloom .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes bloom{from{transform:scale(.2)}to{transform:scale(1.2)}}
  .q-count{
    font-size:13px;font-weight:800;color:var(--ink);
    background:var(--cream);border:2.5px solid var(--ink-soft);border-radius:999px;
    padding:5px 16px;box-shadow:0 4px 10px rgba(107,91,78,.1);
  }
  .card{
    width:100%;background:rgba(255,253,246,.94);border:2.5px solid #D8CBB8;border-radius:26px;
    box-shadow:0 10px 28px rgba(107,91,78,.14);
    padding:26px 20px 20px;position:relative;
  }
  .card::after{ /* 小花贴纸 */
    content:'🌷';position:absolute;top:-16px;right:-6px;font-size:24px;line-height:1;
    transform:rotate(12deg);filter:drop-shadow(0 3px 4px rgba(107,91,78,.25));
  }
  .card.pop{animation:cardIn .5s cubic-bezier(.2,1.2,.35,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .card.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(4px)}
  }
  .q-badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:800;letter-spacing:2px;color:#fff;
    background:var(--blue);border:2px solid var(--ink-soft);
    border-radius:999px;padding:5px 14px 5px 10px;
    box-shadow:0 4px 8px rgba(127,166,201,.35);
  }
  .q-badge::before{content:'🌷';font-size:12px}
  .q-text{
    font-size:clamp(19px,5.5vw,24px);line-height:1.75;margin:18px 0 20px;
    font-weight:900;color:var(--ink);position:relative;
  }
  .q-text .you{color:var(--pink)}
  .q-text .her{color:var(--blue)}

  /* 选项田野（躲猫猫区域） */
  .options{
    position:relative;height:clamp(250px,42vh,330px);
    border:2.5px solid #C6DCB0;border-radius:20px;
    background:linear-gradient(180deg,rgba(242,249,236,.9) 0%,rgba(226,240,214,.9) 100%);
    box-shadow:inset 0 2px 8px rgba(111,167,79,.12);
  }
  .opt{
    position:absolute;width:74%;max-width:290px;
    text-align:left;font-family:inherit;font-size:15.5px;font-weight:800;color:var(--ink);
    background:var(--cream);border:2.5px solid var(--ink-soft);border-radius:16px;
    padding:13px 18px;cursor:pointer;
    box-shadow:0 5px 12px rgba(107,91,78,.13);
    transition:left .42s cubic-bezier(.34,1.56,.64,1), top .42s cubic-bezier(.34,1.56,.64,1), transform .3s, box-shadow .3s, background .3s;
  }
  .opt .mark{color:var(--pink);font-weight:900;margin-right:8px}
  .opt.ok{ /* 正确答案：安静地发光 */
    border-color:var(--pink);
    box-shadow:0 5px 12px rgba(107,91,78,.13), 0 0 0 4px rgba(232,137,156,.14);
    animation:okBreathe 2.2s ease-in-out infinite;
  }
  @keyframes okBreathe{
    0%,100%{box-shadow:0 5px 12px rgba(107,91,78,.13), 0 0 0 4px rgba(232,137,156,.1)}
    50%{box-shadow:0 5px 12px rgba(107,91,78,.13), 0 0 0 10px rgba(232,137,156,.22)}
  }
  .opt.running{ /* 逃跑中 */
    transform:rotate(7deg) scale(.94);
    background:#FFF8DC;border-color:var(--ink-soft);
    box-shadow:0 5px 12px rgba(107,91,78,.13), 0 0 16px rgba(251,215,126,.75);
  }
  .opt.tired{opacity:.88;animation:tiredWobble .5s ease-in-out infinite}
  @keyframes tiredWobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
  .opt.correct{
    background:linear-gradient(180deg,var(--pink-soft),var(--pink));color:#fff;border-color:var(--ink-soft);
    box-shadow:0 5px 12px rgba(107,91,78,.13), 0 0 18px rgba(232,137,156,.5);
    animation:correctPulse .5s;
  }
  .opt.correct .mark{color:#fff}
  @keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
  .opt.wrong{
    background:#F1EFE8;border-color:#C9C3B8;color:#B5AFA3;
    text-decoration:line-through;cursor:not-allowed;box-shadow:none;
  }
  .opt.disabled{pointer-events:none;opacity:.8}
  .puff{position:absolute;pointer-events:none;font-size:17px;z-index:5;animation:puff .55s ease-out forwards}
  @keyframes puff{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-18px) scale(1.35)}}

  .float-plus{position:fixed;z-index:70;pointer-events:none;font-size:26px;animation:plusFly .9s ease-out forwards}
  @keyframes plusFly{
    0%{opacity:0;transform:translateY(0) scale(.5)}
    20%{opacity:1;transform:translateY(-14px) scale(1.1)}
    100%{opacity:0;transform:translateY(-70px) scale(.9)}
  }
  .cheer{margin-top:14px;text-align:center;font-size:14.5px;font-weight:900;color:var(--pink);min-height:22px;letter-spacing:1px}

  /* ============ 结局 ============ */
  #result{justify-content:center;text-align:center}
  .result-title{
    font-size:clamp(32px,8vw,42px);font-weight:800;letter-spacing:5px;color:#fff;
    -webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 rgba(107,91,78,.14);
  }
  .result-title .hl{
    background:linear-gradient(180deg,#FFF3C9,var(--yellow));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:0;
  }
  .win-tag{
    display:inline-block;margin-top:12px;font-size:13px;font-weight:800;letter-spacing:4px;color:var(--ink);
    background:var(--cream);border:2.5px solid var(--ink-soft);border-radius:999px;
    padding:5px 18px;box-shadow:0 4px 10px rgba(107,91,78,.1);
  }
  .score-chips{display:flex;gap:12px;margin:20px 0 16px;flex-wrap:wrap;justify-content:center}
  .chip{
    color:var(--ink);background:var(--cream);border:2.5px solid var(--ink-soft);border-radius:999px;
    padding:8px 18px;font-size:14px;font-weight:900;box-shadow:0 4px 10px rgba(107,91,78,.1);
  }
  .chip.mint{background:var(--pink-soft);border-color:var(--pink)}
  .chip.pink{background:#FFF3C9;border-color:var(--yellow)}
  .verdict{
    margin-bottom:22px;font-size:15px;font-weight:800;color:var(--ink);line-height:1.8;
    background:rgba(255,253,246,.9);border:2.5px solid #D8CBB8;border-radius:999px;
    padding:9px 22px;display:inline-block;box-shadow:0 4px 10px rgba(107,91,78,.1);
  }

  .letter-wrap{position:relative;width:100%;max-width:430px;margin:0 auto;min-width:0}
  .letter{
    width:100%;background:var(--paper);border:2.5px solid #E0D3BE;border-radius:16px;
    box-shadow:0 10px 26px rgba(107,91,78,.16);
    padding:34px 26px 26px;text-align:left;min-height:280px;position:relative;
    background-image:linear-gradient(rgba(232,137,156,.08) 1px, transparent 1px);
    background-size:100% 38px;
    user-select:text;-webkit-user-select:text;
  }
  .letter .tape{ /* 纸胶带 */
    position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:86px;height:26px;background:rgba(251,215,126,.75);
    border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6);
    box-shadow:0 3px 6px rgba(107,91,78,.12);
  }
  .letter .blossom{ /* 樱花贴纸 */
    position:absolute;top:12px;right:14px;font-size:26px;
    transform:rotate(12deg);filter:drop-shadow(0 3px 4px rgba(107,91,78,.25));
  }
  .letter h3{
    font-size:20px;font-weight:900;letter-spacing:2px;color:var(--ink);margin-bottom:14px;
  }
  .letter h3 em{font-style:normal;color:var(--pink)}
  .letter .lines{
    font-size:16.5px;line-height:2.1;letter-spacing:.5px;font-weight:600;
    color:#5F5144;white-space:pre-wrap;word-break:break-word;
  }
  .letter .caret{display:inline-block;width:8px;height:17px;background:var(--pink);vertical-align:-2px;animation:blink .8s step-end infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  .letter .sig{
    margin-top:20px;text-align:right;font-size:16px;font-weight:900;color:var(--ink);
    letter-spacing:2px;position:relative;
  }
  .letter .sig small{display:block;font-size:10.5px;font-weight:700;color:#B5AFA3;margin-top:3px;letter-spacing:3px}

  .replay-btn{
    margin-top:26px;border:2.5px solid var(--ink-soft);border-radius:999px;padding:13px 38px;
    font-size:15.5px;font-family:inherit;font-weight:900;letter-spacing:3px;color:var(--ink);cursor:pointer;
    background:linear-gradient(180deg,#FFF3C9 0%,var(--yellow) 100%);
    box-shadow:0 8px 18px rgba(107,91,78,.16);
    transition:transform .15s, box-shadow .15s;
  }
  .replay-btn:hover{transform:translateY(-2px)}
  .replay-btn:active{transform:translateY(2px) scale(.98)}
  .result-made{
    margin-top:16px;font-size:12px;font-weight:700;color:var(--ink);letter-spacing:3px;
    background:rgba(255,253,246,.8);border:2px solid rgba(154,138,120,.55);border-radius:999px;
    padding:4px 16px;display:inline-block;
  }

  .petal{position:fixed;top:-40px;z-index:80;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(360deg);opacity:.15}}
</style>
</head>
<body>

<!-- ============ SVG 手绘素材（云朵 / 小鸟 / 小花 / 小爱心） ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="sun" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FFF9E3"/>
      <stop offset="100%" stop-color="#FCE3A8"/>
    </radialGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FBF6E"/>
      <stop offset="100%" stop-color="#6FA74F"/>
    </linearGradient>
    <radialGradient id="cloudG" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#FBFDFF"/>
      <stop offset="100%" stop-color="#EAF3FA"/>
    </radialGradient>
    <symbol id="cloud" viewBox="0 0 200 92">
      <ellipse cx="58" cy="62" rx="38" ry="24" fill="url(#cloudG)" stroke="#D9E8F3" stroke-width="1.5"/>
      <ellipse cx="96" cy="44" rx="32" ry="22" fill="url(#cloudG)" stroke="#D9E8F3" stroke-width="1.5"/>
      <ellipse cx="136" cy="64" rx="36" ry="22" fill="url(#cloudG)" stroke="#D9E8F3" stroke-width="1.5"/>
      <rect x="24" y="58" width="120" height="26" rx="13" fill="url(#cloudG)" stroke="#D9E8F3" stroke-width="1.5"/>
      <path d="M34 70 Q100 82 166 70" fill="none" stroke="#D2E4F1" stroke-width="2" opacity=".7" stroke-linecap="round"/>
    </symbol>
    <symbol id="tree" viewBox="0 0 40 56">
      <path d="M20 26 L38 44 L2 44 Z" fill="#7FB55C" stroke="#6B5B4E" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 16 L34 30 L6 30 Z" fill="#8FBF6E" stroke="#6B5B4E" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 8 L30 20 L10 20 Z" fill="#A5CC82" stroke="#6B5B4E" stroke-width="2" stroke-linejoin="round"/>
      <rect x="18.5" y="44" width="3" height="10" fill="#A97C50" stroke="#6B5B4E" stroke-width="1.5"/>
    </symbol>
    <symbol id="bird" viewBox="0 0 60 28">
      <path d="M6 19 Q28 3 54 19" fill="none" stroke="#7A6A5A" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 10 Q34 4 42 7" fill="none" stroke="#7A6A5A" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="flower" viewBox="0 0 40 44">
      <g fill="#F9B8C8" stroke="#6B5B4E" stroke-width="2" stroke-linejoin="round">
        <ellipse cx="20" cy="8" rx="6.5" ry="9"/>
        <ellipse cx="20" cy="8" rx="6.5" ry="9" transform="rotate(72 20 20)"/>
        <ellipse cx="20" cy="8" rx="6.5" ry="9" transform="rotate(144 20 20)"/>
        <ellipse cx="20" cy="8" rx="6.5" ry="9" transform="rotate(216 20 20)"/>
        <ellipse cx="20" cy="8" rx="6.5" ry="9" transform="rotate(288 20 20)"/>
      </g>
      <circle cx="20" cy="20" r="5.5" fill="#FBD77E" stroke="#6B5B4E" stroke-width="2"/>
      <path d="M20 26 V38 M13 31 Q20 28 20 33 M27 31 Q20 28 20 33" fill="none" stroke="#6FA74F" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M12 21C12 21 3 14.5 3 8.8 3 5.6 5.6 3 8.8 3c1.7 0 3.3.8 4.2 2.1C13.9 3.8 15.5 3 17.2 3 20.4 3 23 5.6 23 8.8c0 5.7-9 12.2-11 12.2z"
        fill="#F4A6BC" stroke="#6B5B4E" stroke-width="1.4"/>
    </symbol>
  </defs>
</svg>

<!-- ============ 固定背景层 ============ -->
<div class="bg">
  <svg class="cloud c1" style="left:6%;width:190px" viewBox="0 0 200 92"><use href="#cloud"/></svg>
  <svg class="cloud c2" style="right:8%;width:150px" viewBox="0 0 200 92"><use href="#cloud"/></svg>
  <svg class="cloud c3" style="left:16%;width:120px;opacity:.85" viewBox="0 0 200 92"><use href="#cloud"/></svg>
  <svg class="bird" width="70" viewBox="0 0 60 28"><use href="#bird"/></svg>
  <svg class="bird b2" width="48" viewBox="0 0 60 28"><use href="#bird"/></svg>
  <!-- 远山（三层递进 + 小松树） -->
  <svg class="hill-far" viewBox="0 0 600 150" preserveAspectRatio="none">
    <path d="M0 150 L0 82 Q90 26 190 74 Q280 116 380 64 Q470 22 560 76 Q590 92 600 84 L600 150 Z" fill="#D3E9C0"/>
    <use href="#tree" x="210" y="96" width="20" height="28" opacity=".85"/>

</div>

<button id="soundBtn" title="声音开关">🔊</button>

<!-- ============ 开场 ============ -->
<section id="intro" class="screen active">
  <span class="badge">✦ LOVE QUIZ · SUMMER BREEZE ✦</span>
  <h1>恋爱答题闯关</h1>
  <p class="sub"><b>大笨蛋</b> × <b class="he">小可爱</b></p>
  <p class="tip">共 8 题 · 只有真正的答案才点得到哦 💗</p>
  <button class="enter-btn" id="startBtn">开始答题 💗</button>

  <!-- 草坡小房子（烟囱冒爱心） -->
  <div class="scene">
    <svg viewBox="0 0 320 205">
      <!-- 草坡 -->
      <ellipse cx="160" cy="192" rx="152" ry="34" fill="url(#grassG)"/>

      <!-- 草地上两朵小花 -->
      <use href="#flower" x="34" y="150" width="24" height="26"/>

      <!-- 烟囱 + 爱心烟 -->
      <rect x="193" y="54" width="17" height="44" fill="#D9B98C" stroke="#6B5B4E" stroke-width="2.5"/>

      <polygon points="94,120 160,50 226,120" fill="#E8846B" stroke="#6B5B4E" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="94,120 160,50 226,120 160,76" fill="#F2A58F" opacity=".45"/>

      <rect x="112" y="112" width="96" height="82" rx="6" fill="#FFF6E9" stroke="#6B5B4E" stroke-width="3"/>

      <circle cx="142" cy="152" r="14" fill="#BFE0F0" stroke="#6B5B4E" stroke-width="2.5"/>
      <line x1="142" y1="138" x2="142" y2="166" stroke="#6B5B4E" stroke-width="2"/>

      <path d="M182,194 L182,162 Q194,150 206,162 L206,194 Z" fill="#A97C50" stroke="#6B5B4E" stroke-width="2.5"/>

  <p class="made-by">❤ 大笨蛋 出品</p>

  <span class="float" style="left:10%;font-size:15px;animation-duration:12s">🌸</span>

  <span class="float" style="left:55%;font-size:14px;animation-duration:13s;animation-delay:-9s">🌷</span>
  <span class="float" style="left:78%;font-size:12px;animation-duration:16s;animation-delay:-3s">🌼</span>
  <span class="float" style="left:92%;font-size:15px;animation-duration:11s;animation-delay:-7s">🌸</span>
</section>

<!-- ============ 答题 ============ -->
<section id="quiz" class="screen hidden">
  <div class="quiz-head">
    <div class="progress" id="progress"></div>
    <div class="q-count" id="qCount">第 1 / 8 题</div>
  </div>
  <div class="card" id="card">
    <span class="q-badge" id="qBadge">LEVEL 1</span>
    <p class="q-text" id="qText"></p>
    <div class="options" id="options"></div>
    <div class="cheer" id="cheer"></div>
  </div>
</section>

<!-- ============ 结局 ============ -->
<section id="result" class="screen hidden">
  <div class="result-title">恭喜<span class="hl">通关</span>！</div>
  <p class="win-tag">★ YOU WIN ★</p>
  <div class="score-chips">
    <div class="chip mint" id="chipRight"></div>
    <div class="chip pink" id="chipMiss"></div>
  </div>
  <p class="verdict" id="verdict"></p>
  <div class="letter-wrap">
    <div class="letter">
      <span class="tape"></span>
      <span class="blossom">🌸</span>
      <h3>💌 TO <em>小可爱</em></h3>
      <div class="lines" id="letterLines"></div>
      <div class="sig hidden" id="sig">—— 爱你的 大笨蛋<small>QIXI · LOVE QUIZ</small></div>
    </div>
  </div>
  <button class="replay-btn hidden" id="replayBtn">再玩一次 🔁</button>
  <p class="result-made hidden" id="resultMade">❤ 大笨蛋 出品</p>
</section>

<script>
/* ============================================================
 *  LOVE QUIZ · 恋爱答题闯关（宫崎骏漫画风 · 躲猫猫选项）
 *  定制：改 QUESTIONS 题库、LETTER 情书，YOU/HER 两个昵称变量
 * ============================================================ */

const YOU = '大笨蛋';   // ← 你的昵称
const HER = '小可爱';   // ← 她的昵称

const QUESTIONS = [
  { q: '今天是什么日子，' + HER + '知道吗？', opts: ['普通的一天', '七夕节，' + YOU + '要表白 ❤', '周末而已'], a: 1 },
  { q: HER + '生气的时候，' + YOU + '的正确做法是？', opts: ['讲道理讲到她服', '先道歉，再抱抱', '假装没看见'], a: 1 },
  { q: YOU + '每天早上醒来，第一件事是？', opts: ['看手机', '想' + HER, '赖床'], a: 1 },
  { q: '下面哪句话是' + YOU + '的心声？', opts: ['我超爱' + HER, HER + '真烦人', '还是游戏香'], a: 0 },
  { q: '七夕当晚，' + YOU + '最想带' + HER + '去？', opts: ['看星星，说悄悄话', '网吧开黑', '公司加班'], a: 0 },
  { q: HER + '发来「在吗？」，' + YOU + '应该在？', opts: ['秒回！', '先打完这局', '睡着（已读不回）'], a: 0 },
  { q: YOU + '对' + HER + '的爱有多深？', opts: ['像向日葵一样向着你', '就一点点', '七夕限定，过期作废'], a: 0 },
  { q: '最后一题：我们俩，谁会先说「我爱你」？', opts: [YOU + '先说', HER + '先说', '每天都互相说 ❤'], a: 2 }
];

const LETTER = [
  '致 ' + HER + '：', '',
  '如果爱情是一场考试，', '那我的答案永远只有一个——', '你。', '',
  '你像向日葵一样明亮，', '而我，愿意永远向着你。', '',
  '七夕快乐，' + HER + '，', '以后的每个七夕，', '我都要陪你一起过。'
];

/* ================= 音效 ================= */
let actx = null, soundOn = true;
function beep(freq, dur, type, when, gain) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.13, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const playCorrect = () => { beep(523.25,.12,'sine',0); beep(659.25,.12,'sine',.12); beep(783.99,.22,'sine',.24); };
const playWrong   = () => { beep(180,.22,'square',0,.07); };
const playDodge   = () => { beep(440,.07,'square',0,.05); beep(660,.07,'square',.07,.05); beep(880,.1,'square',.14,.05); };
const playWin     = () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,.2,'sine',i*.13,.13)); };

document.getElementById('soundBtn').addEventListener('click', function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) beep(660,.15,'sine',0,.1);
});

/* ================= 答题引擎 ================= */
let index = 0, misses = 0, answered = false;
const $ = id => document.getElementById(id);
const progressEl = $('progress'), qCountEl = $('qCount'), cardEl = $('card'),
      qBadgeEl = $('qBadge'), qTextEl = $('qText'), optionsEl = $('options'), cheerEl = $('cheer');

const TAUNTS = [
  '诶？差一点点～',
  '抓不到抓不到 😝',
  '嘻嘻，它跑掉啦～',
  '再来！就要点到了！',
  '它说：抓我呀抓我呀～',
  '哎呀，再快一点点嘛～',
  HER + ' 加油，快抓住它！'
];

function puff(btn){
  const s = document.createElement('span');
  s.className = 'puff'; s.textContent = '✨';
  s.style.left = (btn.offsetLeft + btn.offsetWidth/2 - 12) + 'px';
  s.style.top  = (btn.offsetTop  + btn.offsetHeight/2 - 10) + 'px';
  optionsEl.appendChild(s);
  setTimeout(() => s.remove(), 580);
}

function initDodge(btns, correctIdx){
  btns.forEach((btn, i) => {
    if (i === correctIdx) { btn.classList.add('ok'); return; }  // 正确答案不跑
    let dodges = 0, canRun = true, lastDodge = 0;
    const tryDodge = (px, py) => {
      if (!canRun || answered) return;
      const now = Date.now();
      if (now - lastDodge < 280) return;            // 冷却，防止原地抽搐
      lastDodge = now;
      const ar = optionsEl.getBoundingClientRect();
      const bw = btn.offsetWidth, bh = btn.offsetHeight;
      const minX = 4, maxX = ar.width - bw - 4, minY = 4, maxY = ar.height - bh - 4;
      if (maxX <= minX || maxY <= minY){            // 被逼到角落：放弃挣扎，可以被抓住
        canRun = false; btn.classList.add('tired');
        cheerEl.textContent = '😮‍💨 被逼到角落，放弃挣扎……';
        btn.addEventListener('click', () => pick(i, btn), {once:true});
        return;
      }
      let nx, ny;
      for (let t = 0; t < 10; t++){                 // 别跑到手指/光标底下
        nx = minX + Math.random() * (maxX - minX);
        ny = minY + Math.random() * (maxY - minY);
        const dx = px - (ar.left + nx + bw/2), dy = py - (ar.top + ny + bh/2);
        if (Math.hypot(dx, dy) > 140) break;
      }
      puff(btn);
      btn.style.left = nx + 'px';
      btn.style.top  = ny + 'px';
      btn.classList.add('running');
      playDodge();
      dodges++;
      cheerEl.textContent = TAUNTS[Math.min(dodges - 1, TAUNTS.length - 1)];
      if (dodges >= 7){                             // 跑累了，可以被抓住
        canRun = false; btn.classList.add('tired');
        cheerEl.textContent = '😮‍💨 跑累了……被你抓住了';
        btn.addEventListener('click', () => pick(i, btn), {once:true});
      }
    };
    btn.addEventListener('pointerenter', e => tryDodge(e.clientX, e.clientY));
    btn.addEventListener('mousedown', e => {
      if (canRun && !answered){ e.preventDefault(); tryDodge(e.clientX, e.clientY); }
    });
    btn.addEventListener('touchstart', e => {
      if (canRun && !answered){
        e.preventDefault();
        const t = e.changedTouches[0];
        tryDodge(t.clientX, t.clientY);
      }
    }, {passive:false});
  });
}

function renderProgress(){
  progressEl.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++){
    const h = document.createElement('i');
    h.textContent = '🌷';
    if (i < index) h.classList.add('on');
    progressEl.appendChild(h);
  }
}

function renderQuestion(){
  const q = QUESTIONS[index];
  answered = false;
  cardEl.classList.remove('shake'); cardEl.classList.remove('pop');
  void cardEl.offsetWidth;
  cardEl.classList.add('pop');
  qBadgeEl.textContent = 'LEVEL ' + (index + 1);
  qCountEl.textContent = '第 ' + (index + 1) + ' / ' + QUESTIONS.length + ' 题';
  cheerEl.textContent = '';
  qTextEl.innerHTML = q.q
    .replace(new RegExp(YOU,'g'), '<span class="you">' + YOU + '</span>')
    .replace(new RegExp(HER,'g'), '<span class="her">' + HER + '</span>');
  optionsEl.innerHTML = '';
  const btns = [];
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="mark">' + '①②③④'[i] + '</span>' + opt;
    b.addEventListener('click', () => pick(i, b));
    optionsEl.appendChild(b);
    btns.push(b);
  });
  const arH = optionsEl.clientHeight, arW = optionsEl.clientWidth;
  btns.forEach((b, i) => {                          // 初始三个槽位
    b.style.top  = Math.round(8 + i * ((arH - b.offsetHeight - 16) / 2)) + 'px';
    b.style.left = Math.round((arW - b.offsetWidth) / 2) + 'px';
  });
  initDodge(btns, q.a);
  renderProgress();
}

function pick(i, btn){
  if (answered) return;
  const q = QUESTIONS[index];
  const btns = [...optionsEl.children];
  if (i === q.a){
    answered = true;
    btn.classList.add('correct');
    btns.forEach(b => b.classList.add('disabled'));
    playCorrect();
    cheerEl.textContent = '答对啦！' + HER + ' 真聪明 ❤';
    spawnPlus(btn);
    setTimeout(next, 950);
  } else {
    misses++;
    btn.classList.add('wrong');
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    playWrong();
    cheerEl.textContent = '再想想嘛～';
  }
}

function spawnPlus(btn){
  const r = btn.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'float-plus';
  s.textContent = '+1 🌷';
  s.style.left = (r.left + r.width/2 - 16) + 'px';
  s.style.top  = (r.top - 8) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 950);
}

function next(){
  index++;
  if (index < QUESTIONS.length) { renderQuestion(); return; }
  showResult();
}

/* ================= 结局 ================= */
function showResult(){
  playWin();
  $('intro').classList.add('hidden');
  $('quiz').classList.add('hidden');
  const res = $('result');
  res.classList.remove('hidden');
  res.classList.add('active','anim');
  const total = QUESTIONS.length;
  $('chipRight').textContent = '答对 ' + total + ' / ' + total;
  $('chipMiss').textContent = misses === 0 ? '一次都没错！' : '错了 ' + misses + ' 次';
  $('verdict').textContent = misses === 0 ? '一次都没错，' + YOU + ' 感动到哭！'
    : misses <= 2 ? '只错了一点点，' + YOU + ' 假装没看见～'
    : '错了好几次……没关系，' + YOU + ' 全都原谅你 ❤';
  petalRain();
  typeLetter();
}

function typeLetter(){
  const linesEl = $('letterLines');
  linesEl.textContent = '';
  const all = LETTER.join('\n');
  let i = 0;
  const caret = document.createElement('span');
  caret.className = 'caret';
  linesEl.appendChild(caret);
  const timer = setInterval(() => {
    if (i <= all.length){
      caret.remove();
      linesEl.textContent = all.slice(0, i);
      linesEl.appendChild(caret);
      i++;
    } else {
      clearInterval(timer);
      caret.remove();
      linesEl.appendChild(caret);
      setTimeout(() => {
        caret.remove();
        $('sig').classList.remove('hidden');
        $('replayBtn').classList.remove('hidden');
        $('resultMade').classList.remove('hidden');
        petalRain();
      }, 400);
    }
  }, 55);
}

function petalRain(){
  const emojis = ['🌸','🌼','🌷','💮','✨','🌿'];
  for (let i = 0; i < 26; i++){
    const s = document.createElement('div');
    s.className = 'petal';
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.fontSize = (13 + Math.random()*20) + 'px';
    s.style.animationDuration = (2.6 + Math.random()*2.4) + 's';
    s.style.animationDelay = (Math.random()*0.8) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6400);
  }
}

/* ================= 事件 ================= */
$('startBtn').addEventListener('click', () => {
  $('intro').classList.add('hidden');
  const qz = $('quiz');
  qz.classList.remove('hidden');
  qz.classList.add('active','anim');
  renderQuestion();
});
$('replayBtn').addEventListener('click', () => {
  index = 0; misses = 0;
  $('sig').classList.add('hidden');
  $('replayBtn').classList.add('hidden');
  $('resultMade').classList.add('hidden');
  $('result').classList.add('hidden');
  const qz = $('quiz');
  qz.classList.remove('hidden');
  qz.classList.add('active','anim');
  renderQuestion();
});
</script>
