<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 恋爱答题闯关 · 星空银河版</title>
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<style>
  :root{
    --ink:#0b1026;
    --text:#f2ecff;
    --dim:rgba(242,236,255,.55);
    --pink:#ff8fc0;
    --cyan:#7fe3ff;
    --gold:#ffd66b;
    --glass:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'KaiTi','STKaiti','楷体','Microsoft YaHei',sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 560px at 15% -10%, rgba(94,66,170,.55) 0%, transparent 60%),
      radial-gradient(900px 520px at 112% 18%, rgba(30,86,120,.5) 0%, transparent 55%),
      radial-gradient(700px 500px at 50% 115%, rgba(160,60,140,.35) 0%, transparent 60%),
      linear-gradient(180deg,#0b1026 0%,#131a40 55%,#251646 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    user-select:none;
  }
  .hidden{display:none !important}

  /* ============ 星空背景 ============ */
  .stars{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 25px 35px,#fff,transparent),
      radial-gradient(1px 1px at 120px 80px,#bfe9ff,transparent),
      radial-gradient(1.8px 1.8px at 200px 150px,#ffd9f2,transparent),
      radial-gradient(1px 1px at 320px 40px,#fff,transparent),
      radial-gradient(1.6px 1.6px at 400px 210px,#fff,transparent),
      radial-gradient(1px 1px at 60px 250px,#cfe8ff,transparent),
      radial-gradient(1.8px 1.8px at 280px 310px,#fff,transparent),
      radial-gradient(1px 1px at 460px 330px,#ffd6f0,transparent),
      radial-gradient(1.4px 1.4px at 160px 380px,#fff,transparent),
      radial-gradient(1px 1px at 380px 120px,#9fd6ff,transparent);
    background-size:520px 420px;
    animation:twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle{50%{opacity:.5}}
  .shoot{
    position:fixed;z-index:0;width:110px;height:2px;border-radius:2px;pointer-events:none;
    background:linear-gradient(90deg,#fff,transparent);
    opacity:0;animation:shoot 6s linear infinite;
  }
  .shoot:nth-child(2){top:16%;left:78%;animation-delay:2.4s}
  .shoot:nth-child(3){top:64%;left:88%;animation-delay:4.2s}
  @keyframes shoot{
    0%{transform:translate(0,0) rotate(-38deg);opacity:0}
    6%{opacity:1}
    16%{transform:translate(-240px,190px) rotate(-38deg);opacity:0}
    100%{transform:translate(-240px,190px) rotate(-38deg);opacity:0}
  }

  /* ============ 通用屏幕 ============ */
  .screen{position:relative;z-index:2;min-height:100vh;width:100%;max-width:560px;margin:0 auto;padding:28px 18px 40px}
  .screen.active{display:flex;flex-direction:column;align-items:center}
  .screen.active.anim{animation:screenIn .5s cubic-bezier(.2,.9,.3,1)}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

  #soundBtn{
    position:fixed;top:14px;right:14px;z-index:60;
    width:44px;height:44px;border:1.5px solid var(--line);border-radius:50%;
    background:rgba(255,255,255,.08);color:var(--text);font-size:20px;cursor:pointer;
    backdrop-filter:blur(6px);line-height:1;
  }
  #soundBtn:active{transform:scale(.92)}

  /* ============ 开场 ============ */
  #intro{justify-content:center;text-align:center;overflow:hidden}
  .moon{
    font-size:86px;line-height:1;position:relative;cursor:pointer;
    filter:drop-shadow(0 0 28px rgba(255,236,190,.55));
    animation:floatMoon 5s ease-in-out infinite;
  }
  @keyframes floatMoon{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .ring{
    position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;
    border:2px solid var(--pink);border-radius:50%;pointer-events:none;
    animation:ringPulse 2.2s ease-out infinite;
  }
  @keyframes ringPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.55);opacity:0}}
  .intro h1{
    margin-top:26px;font-size:clamp(28px,8vw,40px);letter-spacing:5px;
    background:linear-gradient(90deg,var(--gold),var(--pink) 45%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,143,192,.35));
  }
  .intro .sub{margin-top:14px;font-size:16px;color:var(--dim);letter-spacing:2px;line-height:1.9}
  .intro .sub b{color:var(--pink);text-shadow:0 0 12px rgba(255,143,192,.6)}
  .intro .tip{
    margin-top:26px;font-size:13px;color:var(--dim);
    border:1.5px dashed rgba(255,255,255,.28);border-radius:999px;padding:8px 18px;
    background:rgba(255,255,255,.04);
  }
  .enter-btn{
    margin-top:34px;border:none;border-radius:999px;padding:15px 48px;
    font-size:19px;font-family:inherit;font-weight:bold;letter-spacing:3px;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,#ff6fa8,#a06bff);
    box-shadow:0 8px 26px rgba(255,111,168,.45), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s, box-shadow .15s;
  }
  .enter-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(255,111,168,.55), inset 0 1px 0 rgba(255,255,255,.35)}
  .enter-btn:active{transform:scale(.95)}
  .made-by{margin-top:32px;font-size:12px;color:rgba(242,236,255,.4);letter-spacing:2px}

  /* ============ 答题 ============ */
  #quiz{justify-content:flex-start}
  .quiz-head{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .progress{display:flex;gap:5px}
  .progress i{font-style:normal;font-size:20px;opacity:.18;transition:opacity .4s,transform .4s}
  .progress i.on{opacity:1;transform:scale(1.15);filter:drop-shadow(0 0 9px rgba(255,143,192,.95));animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popIn{from{transform:scale(.2)}to{transform:scale(1.15)}}
  .q-count{font-size:13px;color:var(--dim);background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;backdrop-filter:blur(6px)}

  .card{
    width:100%;border-radius:22px;padding:24px 20px 22px;position:relative;
    background:rgba(255,255,255,.055);
    border:1px solid var(--line);
    box-shadow:0 18px 48px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
  }
  .card.pop{animation:cardIn .45s cubic-bezier(.2,1.2,.35,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .card.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-10px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-7px)}80%{transform:translateX(5px)}
  }
  .q-badge{
    display:inline-block;font-size:12px;letter-spacing:2px;color:#fff;
    background:linear-gradient(90deg,#ff8fc0,#b98cff);
    border-radius:999px;padding:4px 14px;box-shadow:0 4px 14px rgba(255,143,192,.35);
  }
  .q-text{font-size:clamp(19px,5.5vw,24px);line-height:1.65;margin:16px 0 18px;font-weight:bold;color:var(--text)}
  .q-text .you{color:var(--cyan);text-shadow:0 0 12px rgba(127,227,255,.5)}
  .q-text .her{color:var(--pink);text-shadow:0 0 12px rgba(255,143,192,.55)}

  /* 选项竞技场（躲猫猫区域） */
  .options{
    position:relative;height:clamp(250px,42vh,330px);
    border:2px dashed rgba(255,255,255,.16);border-radius:18px;
    background:rgba(255,255,255,.02);
  }
  .opt{
    position:absolute;width:72%;max-width:280px;
    text-align:left;font-family:inherit;font-size:16px;color:var(--text);
    background:rgba(255,255,255,.07);
    border:1.5px solid var(--line);border-radius:16px;
    padding:13px 16px;cursor:pointer;
    backdrop-filter:blur(6px);
    transition:left .42s cubic-bezier(.34,1.56,.64,1), top .42s cubic-bezier(.34,1.56,.64,1), transform .3s, box-shadow .3s;
  }
  .opt .mark{color:rgba(242,236,255,.45);font-weight:bold;margin-right:6px}
  .opt.ok{  /* 正确答案：安静地发光，抓得到 */
    border-color:rgba(127,227,255,.75);
    box-shadow:0 0 16px rgba(127,227,255,.3);
    animation:okBreathe 2.2s ease-in-out infinite;
  }
  @keyframes okBreathe{0%,100%{box-shadow:0 0 10px rgba(127,227,255,.22)}50%{box-shadow:0 0 22px rgba(127,227,255,.5)}}
  .opt.running{ /* 逃跑中 */
    transform:rotate(7deg) scale(.94);
    border-color:rgba(255,143,192,.75);
    box-shadow:0 0 16px rgba(255,143,192,.4);
  }
  .opt.tired{opacity:.8;animation:tiredWobble .5s ease-in-out infinite}
  @keyframes tiredWobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
  .opt.correct{
    background:rgba(127,227,255,.16);border-color:var(--cyan);
    box-shadow:0 0 24px rgba(127,227,255,.55);
    animation:correctPulse .5s;
  }
  @keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
  .opt.wrong{
    background:rgba(255,120,140,.12);border-color:#ff7890;color:rgba(242,236,255,.45);
    text-decoration:line-through;cursor:not-allowed;box-shadow:none;
  }
  .opt.disabled{pointer-events:none;opacity:.75}
  .puff{position:absolute;pointer-events:none;font-size:16px;z-index:5;animation:puff .55s ease-out forwards}
  @keyframes puff{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-18px) scale(1.35)}}

  .float-plus{position:fixed;z-index:70;pointer-events:none;font-size:30px;animation:plusFly .9s ease-out forwards}
  @keyframes plusFly{
    0%{opacity:0;transform:translateY(0) scale(.5)}
    20%{opacity:1;transform:translateY(-14px) scale(1.15)}
    100%{opacity:0;transform:translateY(-70px) scale(.9)}
  }
  .cheer{margin-top:14px;text-align:center;font-size:15px;color:var(--cyan);font-weight:bold;min-height:22px;letter-spacing:1px;text-shadow:0 0 10px rgba(127,227,255,.4)}

  /* ============ 结局 ============ */
  #result{justify-content:center;text-align:center}
  .result-title{font-size:clamp(26px,7vw,34px);letter-spacing:2px;color:var(--text)}
  .result-title .hl{
    background:linear-gradient(90deg,var(--gold),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .score-chips{display:flex;gap:10px;margin:18px 0 20px;flex-wrap:wrap;justify-content:center}
  .chip{
    color:var(--text);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:bold;
    background:rgba(255,255,255,.07);border:1.5px solid var(--line);backdrop-filter:blur(6px);
  }
  .chip.mint{border-color:rgba(127,227,255,.6);color:var(--cyan);box-shadow:0 0 14px rgba(127,227,255,.25)}
  .chip.pink{border-color:rgba(255,143,192,.6);color:var(--pink);box-shadow:0 0 14px rgba(255,143,192,.25)}
  .verdict{margin-bottom:20px;font-size:15px;color:var(--dim);line-height:1.7}

  .letter-wrap{position:relative;width:100%;max-width:430px;margin:0 auto}
  .letter{
    border-radius:18px;padding:30px 22px 26px;text-align:left;min-height:280px;position:relative;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    box-shadow:0 18px 44px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(12px);
    user-select:text;-webkit-user-select:text;
  }
  .letter::before{
    content:'✨';position:absolute;top:12px;right:16px;font-size:18px;opacity:.7;
  }
  .letter h3{font-size:20px;letter-spacing:2px;margin-bottom:14px;
    background:linear-gradient(90deg,var(--pink),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .letter .lines{font-size:16px;line-height:2.1;letter-spacing:.5px;white-space:pre-wrap;word-break:break-word}
  .letter .caret{display:inline-block;width:9px;height:19px;background:var(--cyan);vertical-align:-3px;animation:blink .8s step-end infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  .letter .sig{margin-top:18px;text-align:right;font-size:16px;color:var(--cyan);font-weight:bold;letter-spacing:1px}
  .letter .sig small{display:block;font-size:11px;color:var(--dim);font-weight:normal;margin-top:2px}

  .replay-btn{
    margin-top:26px;border:none;border-radius:999px;padding:13px 36px;
    font-size:16px;font-family:inherit;font-weight:bold;letter-spacing:2px;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,#ff6fa8,#a06bff);
    box-shadow:0 8px 24px rgba(255,111,168,.4);
    transition:transform .15s;
  }
  .replay-btn:hover{transform:translateY(-2px)}
  .replay-btn:active{transform:scale(.95)}
  .result-made{margin-top:16px;font-size:12px;color:rgba(242,236,255,.4);letter-spacing:2px}

  .confetti-heart{position:fixed;top:-40px;z-index:80;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(340deg);opacity:.2}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="shoot"></div><div class="shoot"></div><div class="shoot"></div>

<button id="soundBtn" title="声音开关">🔊</button>

<!-- 开场 -->
<section id="intro" class="screen active">
  <div class="moon" id="bigHeart">🌙<span class="ring"></span></div>
  <h1>恋爱答题闯关</h1>
  <p class="sub"><b>大笨蛋</b> 给 <b>小可爱</b> 的<br>七夕专属挑战 · 银河限定</p>
  <p class="tip">共 8 题 · 悄悄告诉你：只有真正的答案才点得到哦 ✨</p>
  <button class="enter-btn" id="startBtn">开始答题 💘</button>
  <p class="made-by">❤ 爱你的大笨蛋 制作</p>
</section>

<!-- 答题 -->
<section id="quiz" class="screen hidden">
  <div class="quiz-head">
    <div class="progress" id="progress"></div>
    <div class="q-count" id="qCount">第 1 / 8 题</div>
  </div>
  <div class="card" id="card">
    <span class="q-badge" id="qBadge">第 1 关</span>
    <p class="q-text" id="qText"></p>
    <div class="options" id="options"></div>
    <div class="cheer" id="cheer"></div>
  </div>
</section>

<!-- 结局 -->
<section id="result" class="screen hidden">
  <div class="result-title">🎉 恭喜通关，<span class="hl">小可爱</span>！</div>
  <div class="score-chips">
    <div class="chip mint" id="chipRight"></div>
    <div class="chip pink" id="chipMiss"></div>
  </div>
  <p class="verdict" id="verdict"></p>
  <div class="letter-wrap">
    <div class="letter">
      <h3>💌 给小可爱的一封信</h3>
      <div class="lines" id="letterLines"></div>
      <div class="sig hidden" id="sig">—— 爱你的 大笨蛋<small>七夕 · 银河限定</small></div>
    </div>
  </div>
  <button class="replay-btn hidden" id="replayBtn">再玩一次 🔁</button>
  <p class="result-made hidden" id="resultMade">❤ 大笨蛋 制作</p>
</section>

<script>
/* ============================================================
 *  恋爱答题闯关 · 星空银河版（躲猫猫选项）
 *  定制：改 QUESTIONS 题库、LETTER 情书，YOU/HER 两个昵称变量
 * ============================================================ */

const YOU = '大笨蛋';   // ← 你的昵称
const HER = '小可爱';   // ← 她的昵称

const QUESTIONS = [
  { q: '今天是什么日子，' + HER + '知道吗？', opts: ['普通的一天', '七夕节，' + YOU + '要表白 ❤', '周末而已'], a: 1 },
  { q: HER + '生气的时候，' + YOU + '的正确做法是？', opts: ['讲道理讲到她服', '先道歉，再抱抱', '假装没看见'], a: 1 },
  { q: YOU + '每天早上醒来，第一件事是？', opts: ['看手机', '想' + HER, '赖床'], a: 1 },
  { q: '下面哪句话是' + YOU + '的心声？', opts: ['我超爱' + HER, HER + '真烦人', '还是游戏香'], a: 0 },
  { q: '七夕当晚，' + YOU + '最想带' + HER + '去？', opts: ['看星星，说悄悄话', '网吧开黑', '公司加班'], a: 0 },
  { q: HER + '发来「在吗？」，' + YOU + '应该在？', opts: ['秒回！', '先打完这局', '睡着（已读不回）'], a: 0 },
  { q: YOU + '对' + HER + '的爱有多深？', opts: ['像星星一样多', '就一点点', '七夕限定，过期作废'], a: 0 },
  { q: '最后一题：我们俩，谁会先说「我爱你」？', opts: [YOU + '先说', HER + '先说', '每天都互相说 ❤'], a: 2 }
];

const LETTER = [
  '致 ' + HER + '：', '',
  '如果爱情是一场考试，', '那我的答案永远只有一个——', '你。', '',
  '从遇见你的那天起，', '我的日子就多了一颗糖，', '甜得想把所有星星都摘给你。', '',
  '七夕快乐，' + HER + '，', '以后的每个七夕，', '我都要陪你一起过。'
];

/* ================= 音效 ================= */
let actx = null, soundOn = true;
function beep(freq, dur, type, when, gain) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.13, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const playCorrect = () => { beep(523.25,.12,'sine',0); beep(659.25,.12,'sine',.12); beep(783.99,.22,'sine',.24); };
const playWrong   = () => { beep(180,.22,'square',0,.07); };
const playDodge   = () => { beep(440,.07,'square',0,.05); beep(660,.07,'square',.07,.05); beep(880,.1,'square',.14,.05); };
const playWin     = () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,.2,'sine',i*.13,.13)); };

document.getElementById('soundBtn').addEventListener('click', function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) beep(660,.15,'sine',0,.1);
});

/* ================= 答题引擎 ================= */
let index = 0, misses = 0, answered = false;
const $ = id => document.getElementById(id);
const progressEl = $('progress'), qCountEl = $('qCount'), cardEl = $('card'),
      qBadgeEl = $('qBadge'), qTextEl = $('qText'), optionsEl = $('options'), cheerEl = $('cheer');

const TAUNTS = [
  '诶？差一点点～',
  '抓不到抓不到 😝',
  '嘻嘻，它跑掉啦～',
  '再来！就要点到了！',
  '它说：抓我呀抓我呀～',
  '哎呀，再快一点点嘛～',
  HER + ' 加油，快抓住它！'
];

function puff(btn){
  const s = document.createElement('span');
  s.className = 'puff'; s.textContent = '💨';
  s.style.left = (btn.offsetLeft + btn.offsetWidth/2 - 12) + 'px';
  s.style.top  = (btn.offsetTop  + btn.offsetHeight/2 - 10) + 'px';
  optionsEl.appendChild(s);
  setTimeout(() => s.remove(), 580);
}

function initDodge(btns, correctIdx){
  btns.forEach((btn, i) => {
    if (i === correctIdx) { btn.classList.add('ok'); return; }  // 正确答案不跑
    let dodges = 0, canRun = true, lastDodge = 0;
    const tryDodge = (px, py) => {
      if (!canRun || answered) return;
      const now = Date.now();
      if (now - lastDodge < 280) return;            // 冷却，防止原地抽搐
      lastDodge = now;
      const ar = optionsEl.getBoundingClientRect();
      const bw = btn.offsetWidth, bh = btn.offsetHeight;
      const minX = 4, maxX = ar.width - bw - 4, minY = 4, maxY = ar.height - bh - 4;
      if (maxX <= minX || maxY <= minY){            // 被逼到角落：放弃挣扎，可以被抓住
        canRun = false; btn.classList.add('tired');
        cheerEl.textContent = '😮💨 被逼到角落，放弃挣扎……';
        btn.addEventListener('click', () => pick(i, btn), {once:true});
        return;
      }
      let nx, ny;
      for (let t = 0; t < 10; t++){                 // 别跑到手指/光标底下
        nx = minX + Math.random() * (maxX - minX);
        ny = minY + Math.random() * (maxY - minY);
        const dx = px - (ar.left + nx + bw/2), dy = py - (ar.top + ny + bh/2);
        if (Math.hypot(dx, dy) > 140) break;
      }
      puff(btn);
      btn.style.left = nx + 'px';
      btn.style.top  = ny + 'px';
      btn.classList.add('running');
      playDodge();
      dodges++;
      cheerEl.textContent = TAUNTS[Math.min(dodges - 1, TAUNTS.length - 1)];
      if (dodges >= 7){                             // 跑累了，可以被抓住
        canRun = false; btn.classList.add('tired');
        cheerEl.textContent = '😮💨 跑累了……被你抓住了';
        btn.addEventListener('click', () => pick(i, btn), {once:true});
      }
    };
    btn.addEventListener('pointerenter', e => tryDodge(e.clientX, e.clientY));
    btn.addEventListener('mousedown', e => {
      if (canRun && !answered){ e.preventDefault(); tryDodge(e.clientX, e.clientY); }
    });
    btn.addEventListener('touchstart', e => {
      if (canRun && !answered){
        e.preventDefault();
        const t = e.changedTouches[0];
        tryDodge(t.clientX, t.clientY);
      }
    }, {passive:false});
  });
}

function renderProgress(){
  progressEl.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++){
    const h = document.createElement('i');
    h.textContent = '❤️';
    if (i < index) h.classList.add('on');
    progressEl.appendChild(h);
  }
}

function renderQuestion(){
  const q = QUESTIONS[index];
  answered = false;
  cardEl.classList.remove('shake'); cardEl.classList.remove('pop');
  void cardEl.offsetWidth;
  cardEl.classList.add('pop');
  qBadgeEl.textContent = '第 ' + (index + 1) + ' 关';
  qCountEl.textContent = '第 ' + (index + 1) + ' / ' + QUESTIONS.length + ' 题';
  cheerEl.textContent = '';
  qTextEl.innerHTML = q.q
    .replace(new RegExp(YOU,'g'), '<span class="you">' + YOU + '</span>')
    .replace(new RegExp(HER,'g'), '<span class="her">' + HER + '</span>');
  optionsEl.innerHTML = '';
  const btns = [];
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="mark">' + '①②③④'[i] + '</span>' + opt;
    b.addEventListener('click', () => pick(i, b));
    optionsEl.appendChild(b);
    btns.push(b);
  });
  const arH = optionsEl.clientHeight, arW = optionsEl.clientWidth;
  btns.forEach((b, i) => {                          // 初始三个槽位
    b.style.top  = Math.round(8 + i * ((arH - b.offsetHeight - 16) / 2)) + 'px';
    b.style.left = Math.round((arW - b.offsetWidth) / 2) + 'px';
  });
  initDodge(btns, q.a);
  renderProgress();
}

function pick(i, btn){
  if (answered) return;
  const q = QUESTIONS[index];
  const btns = [...optionsEl.children];
  if (i === q.a){
    answered = true;
    btn.classList.add('correct');
    btns.forEach(b => b.classList.add('disabled'));
    playCorrect();
    cheerEl.textContent = '答对啦！' + HER + ' 真聪明 ❤';
    spawnPlus(btn);
    setTimeout(next, 950);
  } else {
    misses++;
    btn.classList.add('wrong');
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    playWrong();
    cheerEl.textContent = '再想想嘛～';
  }
}

function spawnPlus(btn){
  const r = btn.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'float-plus';
  s.textContent = '+1 ❤';
  s.style.left = (r.left + r.width/2 - 16) + 'px';
  s.style.top  = (r.top - 8) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 950);
}

function next(){
  index++;
  if (index < QUESTIONS.length) { renderQuestion(); return; }
  showResult();
}

/* ================= 结局 ================= */
function showResult(){
  playWin();
  $('intro').classList.add('hidden');
  $('quiz').classList.add('hidden');
  const res = $('result');
  res.classList.remove('hidden');
  res.classList.add('active','anim');
  const total = QUESTIONS.length;
  $('chipRight').textContent = '答对 ' + total + ' / ' + total;
  $('chipMiss').textContent = misses === 0 ? '一次都没错！' : '错了 ' + misses + ' 次';
  $('verdict').textContent = misses === 0 ? '一次都没错，' + YOU + ' 感动到哭！'
    : misses <= 2 ? '只错了一点点，' + YOU + ' 假装没看见～'
    : '错了好几次……没关系，' + YOU + ' 全都原谅你 ❤';
  confetti();
  typeLetter();
}

function typeLetter(){
  const linesEl = $('letterLines');
  linesEl.textContent = '';
  const all = LETTER.join('\n');
  let i = 0;
  const caret = document.createElement('span');
  caret.className = 'caret';
  linesEl.appendChild(caret);
  const timer = setInterval(() => {
    if (i <= all.length){
      caret.remove();
      linesEl.textContent = all.slice(0, i);
      linesEl.appendChild(caret);
      i++;
    } else {
      clearInterval(timer);
      caret.remove();
      linesEl.appendChild(caret);
      setTimeout(() => {
        caret.remove();
        $('sig').classList.remove('hidden');
        $('replayBtn').classList.remove('hidden');
        $('resultMade').classList.remove('hidden');
        confetti();
      }, 400);
    }
  }, 55);
}

function confetti(){
  const emojis = ['💗','💖','💕','💘','🩷','✨','⭐'];
  for (let i = 0; i < 30; i++){
    const s = document.createElement('div');
    s.className = 'confetti-heart';
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.fontSize = (14 + Math.random()*22) + 'px';
    s.style.animationDuration = (2.4 + Math.random()*2.4) + 's';
    s.style.animationDelay = (Math.random()*0.8) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6200);
  }
}

/* ================= 事件 ================= */
$('startBtn').addEventListener('click', () => {
  $('intro').classList.add('hidden');
  const qz = $('quiz');
  qz.classList.remove('hidden');
  qz.classList.add('active','anim');
  renderQuestion();
});
$('replayBtn').addEventListener('click', () => {
  index = 0; misses = 0;
  $('sig').classList.add('hidden');
  $('replayBtn').classList.add('hidden');
  $('resultMade').classList.add('hidden');
  $('result').classList.add('hidden');
  const qz = $('quiz');
  qz.classList.remove('hidden');
  qz.classList.add('active','anim');
  renderQuestion();
});
$('bigHeart').addEventListener('click', () => beep(880,.12,'sine',0,.08));
</script>
